name: CI/CD Pipeline for the Backend
run-name: 🚀 Deploying Backend - Triggered by ${{ gitea.actor }}

on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - internal/**
      - .gitea/workflows/*Backend.yml

jobs:
  deploy-backend:
    name: 🚀 Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      
      - name: 📦 Install go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            go.sum
          cache: false
      
      - name: 🏗 Build Backend
        run: go build -o main cmd/api/main.go

      - name: 🗜 Create ZIP Archive
        run: |
          mkdir -p zip_temp/migrations
          cp tmp/main zip_temp
          cp internal/server2/migartions/*.sql zip_temp/migrations
          zip -r archive.zip -j zip_temp/*
          rm -r zip_temp

      - name: ☁️ Upload artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          path: |
            main
            internal/server/migrations
            archive.zip

      - name: 🔑 Configure SSH for Deployment
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: 📤 Deploy via SCP
        env:
          USER: deploy
          HOST: jospace.de
          DIR: /home/deploy/releases/countryBox/${{ GITHUB_SHA }}/backend
        run: |
          ssh -i ~/.ssh/id_rsa $USER@$HOST "mkdir -p $DIR"
          scp -i ~/.ssh/id_rsa main $USER@$HOST:$DIR
          ssh -i ~/.ssh/id_rsa $USER@$HOST 'bash -s' < ./scripts/deploy.sh backend $GITHUB_SHA