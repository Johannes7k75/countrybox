name: CI/CD Pipeline for the Backend
run-name: 🚀 Deploying Backend - Triggered by ${{ gitea.actor }}

on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - internal/**
      - .gitea/workflows/**

jobs:
  deploy-backend:
    name: 🚀 Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - run: go version