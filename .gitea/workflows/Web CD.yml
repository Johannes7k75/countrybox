name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀
on:
  workflow_dispatch:
  push:
    paths:
      - web/**
      - .gitea/workflows/**

defaults:
  run:
    working-directory: ./web

jobs: 
  Explore-Gitea-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
    
      - name: Setup PNPM Cache
        run: |
          pnpm store path
          pnpm store prune

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Create ZIP Archive
        run: |
          zip -r country-box-${GITHUB_SHA}.zip web/.output/

      - name: Upload artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          path: |
            web/.output/

      - name: Deploy Website using SCP
        env:
          USER: deploy
          HOST: jospace.de
          DIR: /home/deploy/countrie-box/realeses
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # Deploy dir if not exists
          ssh -i ~/.ssh/id_rsa $USER@$HOST mkdir -p $DIR

          # Copy the build to realeases
          scp -i ~/.ssh/id_rsa country-box-${GITHUB_SHA}.zip $USER@$HOST:$DIR