name: Build & Release

# - Push a tag `vX.Y.Z` → build + push images tagged X.Y.Z, X.Y, X, latest, sha; then create a GitHub release.
#   Pre-release tags (e.g. v1.1.0-rc.1) get their own tag but never move `latest`/`X`/`X.Y`.
# - Manual run (Actions → Build & Release → Run workflow) → build + push `latest` and sha from the chosen branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IS_STABLE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}

jobs:
  build:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.IS_STABLE_TAG }}
            type=semver,pattern={{major}},enable=${{ env.IS_STABLE_TAG == 'true' && !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ env.IS_STABLE_TAG == 'true' || github.event_name == 'workflow_dispatch' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          {
            echo "## Docker images"
            echo
            echo '```sh'
            echo "docker pull ${image}-api:${version}"
            echo "docker pull ${image}-web:${version}"
            echo '```'
          } > notes.md

          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-file notes.md "${flags[@]}"
          fi
