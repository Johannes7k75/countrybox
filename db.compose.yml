---
services:
  db:
    image: mysql:9.2
    container_name: country-db
    restart: unless-stopped
    ports:
      - 127.0.0.1:3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: country
      MYSQL_USER: country
      MYSQL_PASSWORD: country123
  
  dashboard:
    image: phpmyadmin:5.2.2
    container_name: country-dashboard
    restart: unless-stopped
    ports: 
      - 127.0.0.1:8080:80
    environment:
      PMA_ARBITRARY: 1