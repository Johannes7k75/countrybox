stages:
  - build
  - push
  - generate-compose

variables:
  IMAGE_BACKEND: backend:${CI_COMMIT_SHORT_SHA}
  IMAGE_FRONTEND: frontend:${CI_COMMIT_SHORT_SHA}
  REMOTE_HOST: docker.home.jospace.de
  REMOTE_USER: ci-deploy
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

default:
  image: docker:24
  services:
    - docker:24-dind

before_script:
  - apk add --no-cache openssh-client curl bash
  - echo "$SSH_KEY_DEPLOY_B64" | base64 -d > id_rsa && chmod 600 id_rsa
  - eval $(ssh-agent -s)
  - ssh-add id_rsa
  - mkdir -p ~/.docker/cli-plugins
  - curl -sSL https://raw.githubusercontent.com/psviderski/unregistry/main/docker-pussh -o /usr/local/bin/docker-pussh
  - chmod +x /usr/local/bin/docker-pussh
  # - ln -sf /usr/local/bin/docker-pussh ~/.docker/cli-plugins/docker-pussh
  - docker info

# 1. Build Backend Docker image
build_backend:
  stage: build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $IMAGE_BACKEND -f Dockerfile .

# 2. Build Frontend Docker image
build_frontend:
  stage: build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $IMAGE_FRONTEND -f frontend/Dockerfile frontend/

# 3. Push both using docker pussh over SSH
push_images:
  stage: push
  needs: [build_backend, build_frontend]
  before_script:
    - apk add --no-cache openssh-client curl bash
    - echo "$SSH_KEY_DEPLOY_B64" | base64 -d > id_rsa && chmod 600 id_rsa
    - eval $(ssh-agent -s)
    - ssh-add id_rsa
    - mkdir -p ~/.docker/cli-plugins
    - curl -sSL https://raw.githubusercontent.com/psviderski/unregistry/main/docker-pussh -o ~/.docker/cli-plugins/docker-pussh
    - chmod +x ~/.docker/cli-plugins/docker-pussh
  script:
    - ~/.docker/cli-plugins/docker-pussh $IMAGE_BACKEND $REMOTE_USER@$REMOTE_HOST
    - ~/.docker/cli-plugins/docker-pussh $IMAGE_FRONTEND $REMOTE_USER@$REMOTE_HOST

# 4. Generate Compose file for remote deployment
generate_compose:
  stage: generate-compose
  needs: [push_images]
  script:
    - |
      cat <<EOF > docker-compose.generated.yml
      version: '3.8'
      services:
        backend:
          image: $IMAGE_BACKEND
          ports:
            - "8080:8080"
          environment:
            - ENV=production

        frontend:
          image: $IMAGE_FRONTEND
          ports:
            - "3000:3000"
          environment:
            - NODE_ENV=production
      EOF
  artifacts:
    paths:
      - docker-compose.generated.yml
