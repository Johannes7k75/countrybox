stages:
  - build
  - push
  - deploy

variables:
  # Use your GitLab registry URL
  CI_REGISTRY: registry.home.jospace.de
  # Project path in GitLab (e.g., 'mygroup/myproject')
  CI_REGISTRY_IMAGE: $CI_REGISTRY/apps/countrybox
  # GitLab CI will provide these automatically (or use a PAT)
  CI_REGISTRY_USER: $CI_REGISTRY_USER  # GitLab CI variable
  CI_REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD  # GitLab CI variable

  # Image tags
  IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend
  IMAGE_BACKEND_SHA: ${IMAGE_BACKEND}:${CI_COMMIT_SHORT_SHA}
  IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend
  IMAGE_FRONTEND_SHA: ${IMAGE_FRONTEND}:${CI_COMMIT_SHORT_SHA}

  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  # Remote server details (for deployment)
  REMOTE_HOST: srv-2.home.jospace.de
  REMOTE_USER: ci-deploy
  REMOTE_DIR: /home/ci-deploy/countrybox

default:
  image: docker:24
  services:
    - docker:24-dind

before_script:
  - apk add --no-cache openssh-client curl bash
  - echo "$SSH_KEY_DEPLOY" > id_rsa && chmod 600 id_rsa
  - eval $(ssh-agent -s)
  - ssh-add id_rsa

# 1. Build Backend
build_backend:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_BACKEND:latest -f Dockerfile .
    - docker tag $IMAGE_BACKEND:latest $IMAGE_BACKEND_SHA
    - docker push $IMAGE_BACKEND_SHA
    - docker push $IMAGE_BACKEND:latest

# 2. Build Frontend
build_frontend:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_FRONTEND:latest -f frontend/Dockerfile frontend/
    - docker tag $IMAGE_FRONTEND:latest $IMAGE_FRONTEND_SHA
    - docker push $IMAGE_FRONTEND_SHA
    - docker push $IMAGE_FRONTEND:latest

# 4. Deploy to Remote Server
deploy:
  stage: deploy
  needs: [build_backend, build_frontend]
  script:
    # SSH into the server and pull/run the images
    - ssh -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "mkdir -p $REMOTE_DIR"
    - scp -o StrictHostKeyChecking=no compose.yml $REMOTE_USER@$REMOTE_HOST:$REMOTE_DIR/compose.yml
    - |
      ssh -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST << 'EOF'
      cd $REMOTE_DIR
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      docker pull $IMAGE_BACKEND
      docker pull $IMAGE_FRONTEND
      # Stop/remove old containers and start new ones
      docker compose down || true
      docker compose up -d
      EOF