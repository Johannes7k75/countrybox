# Production stack.
#   cp .env.example .env                           # set PUBLIC_ORIGIN, POSTGRES_PASSWORD, BETTER_AUTH_SECRET
#   docker compose pull && docker compose up -d    # published image (pin with COUNTRYBOX_VERSION)
#   docker compose up -d --build                   # or build from this checkout
#
# `app` serves both /api/* and the static web app, and applies pending database migrations on startup.
# Run it behind a reverse proxy (e.g. Traefik) for TLS; see the labels example below.
name: countrybox-v2 # not "countrybox": that belongs to the legacy stack and its volumes

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: countrybox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: countrybox
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U countrybox']
      interval: 3s
      retries: 30

  app:
    image: ghcr.io/johannes7k75/countrybox:${COUNTRYBOX_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://countrybox:${POSTGRES_PASSWORD}@db:5432/countrybox
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      TRUST_PROXY: '1' # read the client IP from X-Forwarded-For; only safe behind a proxy that sets it
      NODE_ENV: production
    ports:
      - 127.0.0.1:${HTTP_PORT:-8088}:8787 # local access only; Traefik reaches the container over its network
    depends_on:
      db:
        condition: service_healthy
    # Behind Traefik: remove `ports`, join Traefik's network, and add labels like these:
    # networks: [default, traefik]
    # labels:
    #   traefik.enable: 'true'
    #   traefik.docker.network: traefik
    #   traefik.http.routers.countrybox.rule: Host(`countrybox.example.com`)
    #   traefik.http.routers.countrybox.entrypoints: websecure
    #   traefik.http.routers.countrybox.tls.certresolver: letsencrypt
    #   traefik.http.services.countrybox.loadbalancer.server.port: '8787'

# networks:
#   traefik:
#     external: true

volumes:
  pgdata:
