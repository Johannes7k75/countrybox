# Production stack.
#   cp .env.example .env                           # set PUBLIC_ORIGIN, POSTGRES_PASSWORD, BETTER_AUTH_SECRET
#   docker compose pull && docker compose up -d    # published images (pin with COUNTRYBOX_VERSION)
#   docker compose up -d --build                   # or build from this checkout
#
# Only `web` is exposed: it serves the static app and proxies /api/* to `api`.
# The API applies pending database migrations on startup.
name: countrybox-v2 # not "countrybox": that belongs to the legacy stack and its volumes

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: countrybox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: countrybox
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U countrybox']
      interval: 3s
      retries: 30

  api:
    image: ghcr.io/johannes7k75/countrybox-api:${COUNTRYBOX_VERSION:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://countrybox:${POSTGRES_PASSWORD}@db:5432/countrybox
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      TRUST_PROXY: '1'
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/johannes7k75/countrybox-web:${COUNTRYBOX_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${HTTP_PORT:-8088}:80
      - ${HTTPS_PORT:-8448}:443
      - ${HTTPS_PORT:-8448}:443/udp # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
