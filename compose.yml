---
services:
  app:
    image: registry.home.jospace.de/apps/countrybox/frontend:latest
    expose:
      - 3000
    environment:
      NUXT_SESSION_PASSWORD: "fMB8qRrr7F9^2nhuA6Jz!a3Rgcne5h7h"
    networks:
      - traefik
      - backend
    labels:
      traefik.enable: true
      traefik.http.routers.country-box.rule: Host(`country.home.jospace.de`) && PathPrefix(`/`) && !PathPrefix(`/api`)
      traefik.http.routers.country-box.entrypoints: websecure
      traefik.http.routers.country-box.tls: true
      traefik.http.services.country-box.loadbalancer.server.port: 3000

  backend:
    image: registry.home.jospace.de/apps/countrybox/backend:latest
    expose:
      - 8080
    environment:
      BLUEPRINT_DB_HOST: database
      BLUEPRINT_DB_PORT: 3306
      BLUEPRINT_DB_DATABASE: country-box
      BLUEPRINT_DB_USERNAME: countryBox
      BLUEPRINT_DB_PASSWORD: ctrue*J3zp7N^1w4tCwyv1rvbOps3hNI
      BLUEPRINT_DB_ROOT_PASSWORD: root
      COOKIE_NAME: __session
      COOKIE_SECRET: secret
      PORT: 8080
      APP_ENV: local
    depends_on:
      - database
    networks:
      - traefik
      - backend
    labels:
      traefik.enable: true
      traefik.http.routers.country-box-api.rule: Host(`country.home.jospace.de`) && PathPrefix(`/api`)
      traefik.http.routers.country-box-api.entrypoints: websecure
      traefik.http.routers.country-box-api.tls: true
      traefik.http.services.country-box-api.loadbalancer.server.port: 8080


  database:
    image: mysql:9.2
    container_name: country-db
    restart: unless-stopped
    expose:
      - 3306
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: country-box
      MYSQL_USER: countryBox
      MYSQL_PASSWORD: ctrue*J3zp7N^1w4tCwyv1rvbOps3hNI

networks:
  backend:
  traefik:
    external: true