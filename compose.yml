# Production stack.
#   cp .env.example .env          # then set PUBLIC_ORIGIN, POSTGRES_PASSWORD, BETTER_AUTH_SECRET
#   docker compose pull && docker compose up -d     # run the published images (COUNTRYBOX_VERSION, default: latest)
#   docker compose up -d --build                    # or build them from this checkout
#
# Only `web` is reachable from outside. It serves the static app and proxies /api/* to `api`.
# The project name stays "countrybox-v2" so it never touches the legacy "countrybox" stack or its volumes.
name: countrybox-v2

x-api: &api
  image: ghcr.io/johannes7k75/countrybox-api:${COUNTRYBOX_VERSION:-latest}
  build:
    context: .
    target: api
  environment:
    DATABASE_URL: postgres://countrybox:${POSTGRES_PASSWORD}@db:5432/countrybox
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
    TRUST_PROXY: "1"
    NODE_ENV: production
  networks:
    - private

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: countrybox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: countrybox
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countrybox"]
      interval: 3s
      retries: 30

  # One-off job: applies database migrations, then exits. `api` waits for it to succeed.
  migrate:
    <<: *api
    command: ["node", "dist/db/migrate.mjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Hono server on Node: auth, sessions, and all /api/* routes. Internal only (port 8787).
  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Caddy: serves the generated Nuxt app and reverse-proxies /api/* to `api`. The only public entry point.
  web:
    image: ghcr.io/johannes7k75/countrybox-web:${COUNTRYBOX_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${HTTP_PORT:-8088}:80
      - ${HTTPS_PORT:-8448}:443
      - ${HTTPS_PORT:-8448}:443/udp # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - private

networks:
  private:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
